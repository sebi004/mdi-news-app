<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2B">
<title>Brief — Daily Business News</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink: #0F1B2B;
    --panel: #16273D;
    --panel-2: #1C324E;
    --gold: #D4A73D;
    --gold-dim: #8A7136;
    --paper: #EFE8DA;
    --muted: #8FA3BF;
    --up: #5FA987;
    --down: #C9705C;
    --rule: rgba(239,232,218,0.12);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  #app{
    max-width:480px;
    height:100vh;
    height:100dvh;
    margin:0 auto;
    position:relative;
    background:var(--ink);
    border-left:1px solid var(--rule);
    border-right:1px solid var(--rule);
  }

  .topbar{
    position:absolute;
    top:0; left:0; right:0;
    z-index:20;
    padding:16px 18px 10px;
    background:linear-gradient(180deg, rgba(15,27,43,0.95) 0%, rgba(15,27,43,0.75) 70%, transparent 100%);
    pointer-events:none;
  }
  .topbar > *{ pointer-events:auto; }

  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .wordmark{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.2px;
    color:var(--paper);
  }
  .wordmark span{ color:var(--gold); }
  .updated-label{
    font-size:11.5px;
    color:var(--muted);
  }

  .filters{
    display:flex;
    gap:8px;
    margin-top:12px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:6px 13px;
    border-radius:999px;
    border:1px solid var(--rule);
    background:rgba(239,232,218,0.04);
    color:var(--muted);
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--ink);
  }

  .feed{
    height:100%;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  .feed::-webkit-scrollbar{ display:none; }

  .card{
    height:100%;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 26px;
    position:relative;
  }

  .card-inner{
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .meta-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .source-badge{
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.3px;
    padding:5px 10px;
    border-radius:5px;
    background:var(--gold);
    color:var(--ink);
  }
  .theme-tag{
    font-size:12px;
    color:var(--gold);
    font-weight:600;
  }
  .theme-tag::before{
    content:"·";
    color:var(--muted);
    margin-right:10px;
  }

  .summary{
    font-family:'Source Serif 4', serif;
    font-weight:400;
    font-size:23px;
    line-height:1.42;
    color:var(--paper);
    letter-spacing:0.1px;
    max-height:52vh;
    overflow-y:auto;
  }

  .companies{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .company-pill{
    font-size:11.5px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    padding:4px 10px;
    border-radius:5px;
    border:1px solid var(--rule);
    color:var(--muted);
  }

  .divider{
    height:1px;
    background:var(--rule);
  }

  .read-more{
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-decoration:none;
    color:var(--paper);
  }
  .read-more .label{
    font-size:14px;
    font-weight:500;
    color:var(--muted);
  }
  .read-more .pub{
    font-size:14px;
    font-weight:600;
    color:var(--paper);
    font-family:'Source Serif 4', serif;
    font-style:italic;
  }
  .arrow-circle{
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid var(--rule);
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }

  .ticks{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:5px;
    z-index:15;
  }
  .tick{
    width:3px;
    height:16px;
    border-radius:2px;
    background:var(--rule);
    transition:background .2s ease, height .2s ease;
  }
  .tick.active{
    background:var(--gold);
    height:24px;
  }

  .counter{
    position:absolute;
    bottom:18px;
    left:26px;
    font-size:11.5px;
    color:var(--muted);
    font-weight:500;
    z-index:15;
  }

  .state-screen{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:0 40px;
    text-align:center;
  }
  .state-screen .icon{ font-size:32px; }
  .state-screen p{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.5;
    margin:0;
  }
  .spinner{
    width:22px; height:22px;
    border-radius:50%;
    border:2px solid var(--rule);
    border-top-color:var(--gold);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="masthead">
      <div class="wordmark">Brief<span>.</span></div>
      <div class="updated-label" id="updatedLabel"></div>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div id="feedContainer">
    <div class="state-screen">
      <div class="spinner"></div>
      <p>Loading today's brief...</p>
    </div>
  </div>

  <div class="ticks" id="ticks"></div>
  <div class="counter" id="counter"></div>
</div>

<script>
const SPECIALIZATIONS = ["All", "Finance", "Strategy", "Information Management", "HR", "Marketing", "Operations"];
const SOURCE_COLORS = {
  "Business Standard": "#D4A73D",
  "Business Line": "#5FA987",
  "Economic Times": "#C9705C",
  "Financial Express": "#8FA3BF",
  "Mint": "#D4A73D",
  "HR Katha": "#5FA987",
  "afaqs!": "#C9705C",
};
function colorFor(source){
  return SOURCE_COLORS[source] || "#8FA3BF";
}

let ARTICLES = [];
let activeSpecialization = "All";

const feedContainer = document.getElementById('feedContainer');
const filtersEl = document.getElementById('filters');
const ticksEl = document.getElementById('ticks');
const counterEl = document.getElementById('counter');
const updatedLabel = document.getElementById('updatedLabel');

async function loadArticles(){
  try {
    const resp = await fetch('data/tagged/latest.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error('fetch failed: ' + resp.status);
    ARTICLES = await resp.json();

    if (!ARTICLES.length) {
      showState("No articles yet — check back after today's digest arrives.");
      return;
    }

    updatedLabel.textContent = `${ARTICLES.length} stories today`;
    renderFilters();
    render();
  } catch (e) {
    showState("Couldn't load today's brief. Pull to refresh or check back shortly.");
    console.error(e);
  }
}

function showState(message){
  feedContainer.innerHTML = `
    <div class="state-screen">
      <div class="icon">📰</div>
      <p>${message}</p>
    </div>
  `;
}

function render(){
  const items = activeSpecialization === "All"
    ? ARTICLES
    : ARTICLES.filter(a => a.primary_specialization === activeSpecialization
        || (a.secondary_specializations || []).includes(activeSpecialization));

  if (!items.length) {
    showState(`No ${activeSpecialization} stories today.`);
    ticksEl.innerHTML = "";
    counterEl.textContent = "";
    return;
  }

  feedContainer.innerHTML = `<div class="feed" id="feed">${items.map(renderCard).join('')}</div>`;

  ticksEl.innerHTML = items.map((_, i) => `<div class="tick ${i===0?'active':''}"></div>`).join('');
  counterEl.textContent = `01 / ${String(items.length).padStart(2,'0')}`;

  attachScrollSpy(items.length);
}

function renderCard(a){
  const companies = a.companies_mentioned || [];
  return `
    <section class="card">
      <div class="card-inner">
        <div class="meta-row">
          <span class="source-badge" style="background:${colorFor(a.source_publication)}">${escapeHtml(a.source_publication || 'Unknown')}</span>
          <span class="theme-tag">${escapeHtml(a.primary_specialization || 'General')}</span>
        </div>
        <p class="summary">${escapeHtml(a.summary || a.headline)}</p>
        ${companies.length ? `<div class="companies">${companies.map(c => `<span class="company-pill">${escapeHtml(c)}</span>`).join('')}</div>` : ''}
        <div class="divider"></div>
        <a class="read-more" href="${a.url}" target="_blank" rel="noopener">
          <div>
            <div class="label">Read full article</div>
            <div class="pub">${escapeHtml(a.source_publication || '')}</div>
          </div>
          <div class="arrow-circle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M7 17L17 7M17 7H9M17 7V15" stroke="#EFE8DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </a>
      </div>
    </section>
  `;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderFilters(){
  filtersEl.innerHTML = SPECIALIZATIONS.map(s =>
    `<button class="chip ${s===activeSpecialization?'active':''}" data-spec="${s}">${s}</button>`
  ).join('');

  filtersEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeSpecialization = chip.dataset.spec;
      renderFilters();
      render();
    });
  });
}

function attachScrollSpy(total){
  const feedEl = document.getElementById('feed');
  if (!feedEl) return;
  let ticking = false;
  feedEl.onscroll = () => {
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const idx = Math.round(feedEl.scrollTop / feedEl.clientHeight);
      document.querySelectorAll('.tick').forEach((t,i) => t.classList.toggle('active', i===idx));
      counterEl.textContent = `${String(idx+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;
      ticking = false;
    });
  };
}

window.addEventListener('keydown', (e) => {
  const feedEl = document.getElementById('feed');
  if (!feedEl) return;
  if(e.key === 'ArrowDown'){ feedEl.scrollBy({top: feedEl.clientHeight, behavior:'smooth'}); }
  if(e.key === 'ArrowUp'){ feedEl.scrollBy({top: -feedEl.clientHeight, behavior:'smooth'}); }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

loadArticles();
</script>

</body>
</html>
